spring.application.name=google-oauth-login
server.port=8080
#server.servlet.context-path=/oauth

# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET as environment variables before starting.


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Local demo only. Do not use debug logging for security-sensitive data in production.

logging.level.org.springframework.security=DEBUG
springdoc.swagger-ui.oauth.use-basic-authentication-with-access-code-grant=true

spring.datasource.url=jdbc:mysql://localhost:3306/oauth_demo
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

application.security.oauth2.keystore-path=oauth-signing-key.p12
application.security.oauth2.keystore-password=changeit
application.security.oauth2.key-alias=oauth-signing-key

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.access-token-expiration=900000

application.security.jwt.refresh-token-expiration=604800000
