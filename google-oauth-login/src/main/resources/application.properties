spring.application.name=google-oauth-login
server.port=8080
#server.servlet.context-path=/oauth

# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET as environment variables before starting.


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/drive.file,https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/calendar.events
# Local demo only. Do not use debug logging for security-sensitive data in production.

logging.level.org.springframework.security=DEBUG
springdoc.swagger-ui.oauth.use-basic-authentication-with-access-code-grant=true

